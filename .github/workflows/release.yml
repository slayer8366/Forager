name: Release to Play internal testing

# Dispatch 2026-10-23-04 (owner's rulings in the planner's window, 2026-10-23: sign on GitHub, "Straight to Play
# internal testing", "You approve in GitHub"). Builds the release bundle from main, signs it with the upload key,
# checks the signature on the artifact itself, and uploads it to Play's internal track as a draft release. Nothing is
# sent to testers until someone rolls the draft out in Play Console.
#
# The gate is the GitHub environment `release`, not this file: its deployment-branch rule allows main only, and its
# required reviewer (slayer8366) must approve every run before the job starts. Until approval, the job has no access
# to the environment's secrets. A dispatch from any other branch is refused by the environment before any step runs.
#
# How to run (on main only): Actions -> "Release to Play internal testing" -> Run workflow, branch main; then approve
# the pending deployment. `gh workflow run release.yml --ref main` does the same. GitHub only offers the button once
# this file is on the default branch (main), and the run uses this file as it is on main.
#
# Never, by design (the repository is public): no pull_request or push trigger; no build artifact upload (the signed
# bundle goes to Play and nowhere else); no secret in a `run:` line, only in step env; no `set -x`.

on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancel one mid-upload: a cancelled run could leave a half-made Play edit.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Outside the workspace, as in ci.yml: resolveBuildIdentity (app/build.gradle.kts) appends `.dirty` to versionName
  # when `git status --porcelain` is non-empty, so nothing this job writes may land inside the checkout.
  ANDROID_SDK_ROOT: ${{ github.workspace }}/../android-sdk
  ANDROID_HOME: ${{ github.workspace }}/../android-sdk
  PACKAGE_NAME: com.zynergylabs.forager.app
  # The upload key's public certificate fingerprints, from the owner's forager-SHA.txt as relayed by the planner for
  # dispatch 2026-10-23-04. Public values, not secrets. The SHA-256 must equal RELEASE_KEYSTORE_CERTIFICATE_SHA256 in
  # app/build.gradle.kts; the "Check the pinned fingerprints agree" step fails the run if the two ever drift apart.
  EXPECTED_UPLOAD_CERT_SHA1: "D3:5F:2F:8C:AE:30:53:08:39:E8:D8:FE:4F:FD:C9:DE:EE:8E:31:BF"
  EXPECTED_UPLOAD_CERT_SHA256: "9F:B6:16:62:46:C0:A5:98:81:80:D3:C7:C2:FA:08:B2:F1:ED:80:0F:44:05:1C:49:7C:8B:F4:FC:B3:41:0B:67"
  # bundletool reads the version back out of the built bundle. Pinned by version and by the sha256 GitHub publishes
  # for the release asset (google/bundletool release 1.18.3, asset digest), checked before the jar is run.
  BUNDLETOOL_VERSION: "1.18.3"
  BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"

jobs:
  release:
    name: Build, sign, verify, upload to internal (draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Branch rule (main only) and required reviewer live on this environment, and so do the signing secrets.
    environment: release

    steps:
      - name: Refuse anything but main
        # Belt and braces behind the environment's own branch rule, which refuses first. If that rule were ever
        # loosened, this still stops the run before any secret is used.
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release runs only from main; this run is on $GITHUB_REF."
            exit 1
          fi

      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode is the commit count (resolveBuildIdentity in app/build.gradle.kts); a shallow clone would
          # give versionCode=1 and an UNVERSIONED- name. The version step below checks this took effect.
          fetch-depth: 0
          # The job needs no git credentials after checkout.
          persist-credentials: false

      - name: Check the pinned fingerprints agree
        # The workflow's expected SHA-256 and the build's own pin must be one value, so a key rotation cannot update
        # one and leave the other checking against the old key.
        run: |
          set -euo pipefail
          build_pin="$(grep -A1 '^val RELEASE_KEYSTORE_CERTIFICATE_SHA256 =' app/build.gradle.kts | sed -n 's/^ *"\([0-9A-F:]*\)".*/\1/p')"
          if [ "$build_pin" != "$EXPECTED_UPLOAD_CERT_SHA256" ]; then
            echo "::error::app/build.gradle.kts pins '$build_pin' but this workflow expects '$EXPECTED_UPLOAD_CERT_SHA256'."
            exit 1
          fi
          echo "The workflow and app/build.gradle.kts pin the same upload certificate SHA-256."

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          # Read the shared cache, never write it: this job runs on main with signing values in its environment, and
          # nothing from a signing build should be saved where every other workflow can restore it.
          cache-read-only: true

      - name: Install the Android SDK with the repo's own setup script
        run: ./scripts/setup-android-sdk.sh

      - name: Decode the upload keystore
        # Into $RUNNER_TEMP (outside the checkout), readable by this user only. The path is not secret; the file is,
        # and the last step deletes it whether or not the run succeeds.
        env:
          KEYSTORE_B64: ${{ secrets.FORAGER_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::FORAGER_UPLOAD_KEYSTORE_B64 is empty or not visible to this job."
            exit 1
          fi
          keystore="$RUNNER_TEMP/forager-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          [ -s "$keystore" ] || { echo "::error::The decoded keystore is empty."; exit 1; }
          echo "FORAGER_SIGNING_STORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "Keystore decoded to $keystore ($(stat -c %s "$keystore") bytes, mode $(stat -c %a "$keystore"))."

      - name: Build the signed release bundle
        # bundleRelease depends on verifyReleaseNeverSignsWithDebugKeystore (refuses no identity, the debug key, or
        # any certificate but RELEASE_KEYSTORE_CERTIFICATE_SHA256) and verifyReleaseHasRoutingAppKey (refuses a
        # keyless build). Both must appear in the log as having run; a green exit alone is not taken as evidence.
        env:
          FORAGER_SIGNING_STORE_PASSWORD: ${{ secrets.FORAGER_SIGNING_STORE_PASSWORD }}
          FORAGER_SIGNING_KEY_ALIAS: ${{ secrets.FORAGER_SIGNING_KEY_ALIAS }}
          FORAGER_SIGNING_KEY_PASSWORD: ${{ secrets.FORAGER_SIGNING_KEY_PASSWORD }}
          FORAGER_ROUTING_APP_KEY: ${{ secrets.FORAGER_ROUTING_APP_KEY }}
        run: |
          set -euo pipefail
          mkdir -p app/build
          log=app/build/release-gradle.log
          ./gradlew --stacktrace --console=plain --no-configuration-cache bundleRelease 2>&1 | tee "$log"
          failed=0
          for task in verifyReleaseNeverSignsWithDebugKeystore verifyReleaseHasRoutingAppKey bundleRelease; do
            if ! grep -q "^> Task :app:$task\b" "$log"; then
              echo "::error:::app:$task does not appear in the Gradle log; the release was not built as claimed."
              failed=1
            fi
          done
          grep -q "^Verified: that certificate matches the pinned upload identity" "$log" \
            || { echo "::error::The signing guard did not log its pinned-identity check."; failed=1; }
          grep -q "^Verified: a routing app key is set for this release build" "$log" \
            || { echo "::error::The routing key guard did not log that a key is set."; failed=1; }
          [ "$failed" -eq 0 ] || exit 1

      - name: Verify the bundle's signature and version
        # Read from the artifact, not from the build's word. Prints only the certificate fingerprints and the version.
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          [ -f "$aab" ] || { echo "::error::No bundle at $aab"; exit 1; }

          # 1. The signature verifies (every entry signed, digests intact).
          verify_out="$(jarsigner -verify "$aab" 2>&1)" || {
            echo "::error::jarsigner -verify failed on $aab"; exit 1; }
          grep -q '^jar verified\.' <<<"$verify_out" || {
            echo "::error::jarsigner did not report 'jar verified.' for $aab"; exit 1; }

          # 2. Exactly one signer, and its certificate is the upload key's. Only the fingerprint lines are printed.
          certs="$(keytool -printcert -jarfile "$aab")"
          sha1s="$(sed -n 's/^[[:space:]]*SHA1: *//p' <<<"$certs")"
          sha256s="$(sed -n 's/^[[:space:]]*SHA256: *//p' <<<"$certs")"
          echo "Bundle certificate SHA-1:   $sha1s"
          echo "Bundle certificate SHA-256: $sha256s"
          failed=0
          if [ "$(grep -c . <<<"$sha256s")" -ne 1 ]; then
            echo "::error::Expected exactly one signing certificate; found $(grep -c . <<<"$sha256s")."
            failed=1
          fi
          [ "$sha1s" = "$EXPECTED_UPLOAD_CERT_SHA1" ] \
            || { echo "::error::SHA-1 does not match the upload key ($EXPECTED_UPLOAD_CERT_SHA1)."; failed=1; }
          [ "$sha256s" = "$EXPECTED_UPLOAD_CERT_SHA256" ] \
            || { echo "::error::SHA-256 does not match the upload key ($EXPECTED_UPLOAD_CERT_SHA256)."; failed=1; }

          # 3. The version is the commit count of this main checkout, not a provisional or dirty identity.
          bundletool="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          curl --fail --silent --show-error --location --output "$bundletool" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $bundletool" | sha256sum --check --strict
          version_code="$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionCode)"
          version_name="$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionName)"
          expected_code="$(git rev-list --count HEAD)"
          echo "Bundle versionCode=$version_code versionName=$version_name; commit count $expected_code"
          [ "$version_code" = "$expected_code" ] \
            || { echo "::error::versionCode $version_code is not this checkout's commit count $expected_code."; failed=1; }
          case "$version_name" in
            UNVERSIONED-*|*.dirty) echo "::error::versionName $version_name is provisional or dirty."; failed=1 ;;
          esac
          [ "$failed" -eq 0 ] || exit 1

          {
            echo "### Signed release bundle"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| versionCode | \`$version_code\` |"
            echo "| versionName | \`$version_name\` |"
            echo "| certificate SHA-256 | \`$sha256s\` |"
            echo "| commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the Play service account is configured
        # Fails here, with a plain message, rather than inside the upload action.
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set on the release environment; nothing was uploaded."
            exit 1
          fi

      - name: Upload to Play internal testing as a draft
        # status: draft creates the release on the internal track without rolling it out; someone reviews and rolls
        # it out in Play Console. Play rejects a versionCode it has already seen, so re-running the same commit fails
        # here rather than replacing anything.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: draft

      - name: Delete the keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/forager-upload.jks"
          if [ -e "$RUNNER_TEMP/forager-upload.jks" ]; then
            echo "::error::The keystore file still exists after deletion."
            exit 1
          fi
          echo "Keystore file removed."
