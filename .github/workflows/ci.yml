name: CI

# Every merge to main before this workflow existed was green on nobody's authority but
# whoever ran the build locally. This runs the same two commands README.md documents --
# assembleDebug and testDebugUnitTest -- on a clean machine, and publishes the APK it built
# so a build is downloadable without anyone building one by hand.

on:
  # pre-main is the working trunk that builds merge into before promotion to main
  # (docs/audits/2026-09-26-pre-main-working-trunk.md), so a merge into it needs its own
  # recorded result, not only the PR's pull_request run.
  push:
    branches: [main, pre-main, dev]
  # No branches: filter here (unlike push above): this project stacks PRs against other
  # working branches, not just main (e.g. PR #49, claude/l4-close-out-beta-prep-night-maps
  # against claude/l4-close-out-beta-prep) -- restricting to main left every PR in that chain
  # with no CI at all until it eventually landed on main.
  pull_request:
  # "Run this branch" (RECORD -865): lets a coder build and test any branch on CI when the
  # laptop is busy, with `gh workflow run ci.yml --ref <branch> [-f tests='...']` (README.md,
  # "Continuous integration"). GitHub only accepts the request once this trigger is on the
  # default branch, and the run then uses the ci.yml at the requested ref. An empty filter
  # runs exactly what push and pull_request run.
  workflow_dispatch:
    inputs:
      tests:
        description: >-
          Optional test filter: Gradle --tests patterns separated by ';' (test names here
          contain spaces and commas). Empty runs every unit test.
        type: string
        required: false
        default: ""

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run's answer stale, so cancel it.
# Runs on main are exempt: main's history is what release APKs are built from, and a
# cancelled run there would leave a commit with no recorded result. Runs on pre-main are
# exempt too: it is the working trunk builds merge into
# (docs/audits/2026-09-26-pre-main-working-trunk.md), each merge into it needs its own
# recorded result, and a cancelled run would leave a merge commit with none.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/pre-main' }}

env:
  # Deliberately outside the workspace. resolveBuildIdentity (app/build.gradle.kts) runs
  # `git status --porcelain` and appends `.dirty` to versionName when it is non-empty, so an
  # SDK unpacked inside the checkout would mark every CI build dirty. This also overrides the
  # runner image's own preinstalled ANDROID_HOME/ANDROID_SDK_ROOT, which is the point: the
  # SDK under test is the one scripts/setup-android-sdk.sh produces, not the one GitHub ships.
  ANDROID_SDK_ROOT: ${{ github.workspace }}/../android-sdk
  ANDROID_HOME: ${{ github.workspace }}/../android-sdk
  # The one place the build-tools version is named in CI. It has to match the version
  # scripts/setup-android-sdk.sh installs; the aapt2 step fails loudly if it does not.
  BUILD_TOOLS_VERSION: "37.0.0"

jobs:
  build:
    name: Build, test, publish APK
    # Pinned rather than ubuntu-latest: `latest` silently moves to the next image, which is a
    # toolchain change nobody chose. Same reason every action below is pinned to a commit sha
    # rather than a mutable tag -- CLAUDE.md, "pin dependency versions ... so a build is
    # reproducible".
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not a default worth accepting. versionCode is the commit count and versionName
          # carries the sha (resolveBuildIdentity in app/build.gradle.kts); a shallow clone
          # answers `rev-list --count` with a plausible small number that means nothing, which
          # the build detects and downgrades to versionCode=1 / UNVERSIONED-shallow-clone-*.
          # An APK like that cannot install over a real build. "Verify the version on the
          # built APK" below checks the setting actually took, rather than trusting this line.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        # Caches ~/.gradle (dependencies, wrapper distribution, build cache). Writes the cache
        # only from main by default, so a PR run reads a warm cache without poisoning it.
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Cache Robolectric's android-all jars
        # Robolectric fetches an instrumented android-all jar (~100 MB) into the local Maven
        # repository on first use. Cached rather than skipped: the layout tests are the only
        # thing in this project that measures the Compose tree, and a CI run that quietly
        # dropped them would report a smaller test count and still look green.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Install the Android SDK with the repo's own setup script
        # Not android-actions/setup-android, and not the runner's preinstalled SDK. Running
        # this script from a clean state is itself the regression test: it aborted with
        # SIGPIPE on any clean install for the project's entire history and nobody noticed,
        # because every build until now happened where the SDK was already present. The
        # minutes a prebuilt action would save are worth less than executing the path
        # README.md tells a new contributor to run.
        run: ./scripts/setup-android-sdk.sh

      - name: Build the debug APK
        # Finalized by verifyNothingTestOnlyReachesTheApk (app/build.gradle.kts), which opens
        # the APK this step produced and fails if Robolectric, JUnit or Compose UI Test
        # classes are inside it.
        # The routing app key reaches BuildConfig.ROUTING_APP_KEY in this APK only (dispatch 2026-10-23-03). The
        # unit-test step has no key, and a fork's PR gets none: both build with routes unavailable.
        env:
          FORAGER_ROUTING_APP_KEY: ${{ secrets.FORAGER_ROUTING_APP_KEY }}
        run: ./gradlew --stacktrace assembleDebug

      - name: Verify the version on the built APK
        # The evidence that fetch-depth: 0 took effect, read out of the artifact rather than
        # assumed from the YAML. Two independent things are checked: that the build did not
        # fall back to a provisional identity, and that the versionCode equals this checkout's
        # real commit count.
        run: |
          set -euo pipefail
          aapt2="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          if [ ! -x "$aapt2" ]; then
            echo "aapt2 not found at $aapt2 -- BUILD_TOOLS_VERSION does not match what" \
                 "scripts/setup-android-sdk.sh installed. Contents of build-tools:"
            ls -1 "$ANDROID_SDK_ROOT/build-tools" || true
            exit 1
          fi
          apk="app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$apk" ] || { echo "No APK at $apk"; exit 1; }

          # Captured whole, then matched from a here-string, rather than piped into `grep -m1`.
          # grep would close the pipe after the first match, aapt2 would take SIGPIPE and exit
          # 141, and `set -o pipefail` would fail this step on a successful dump -- the exact
          # bug scripts/setup-android-sdk.sh documents at its sdkmanager call.
          badging="$("$aapt2" dump badging "$apk")"
          package_line="$(grep -m1 '^package:' <<<"$badging")" || {
            echo "aapt2 dump badging produced no package: line for $apk"; exit 1; }
          version_code="$(printf '%s' "$package_line" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          version_name="$(printf '%s' "$package_line" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          expected_code="$(git rev-list --count HEAD)"

          echo "APK reports versionCode=$version_code versionName=$version_name"
          echo "Commit count of this checkout: $expected_code"

          failed=0
          case "$version_name" in
            UNVERSIONED-*)
              echo "::error::The APK is unversioned ($version_name). The checkout could not" \
                   "answer git's questions -- most likely fetch-depth: 0 was lost. Such an" \
                   "APK reports versionCode=1 and will not install over a real build."
              failed=1
              ;;
          esac
          if [ "$version_code" != "$expected_code" ]; then
            echo "::error::versionCode=$version_code but this checkout has $expected_code" \
                 "commits. The build derived its identity from something other than the" \
                 "history that is actually checked out."
            failed=1
          fi
          [ "$failed" -eq 0 ] || exit 1

          {
            echo "### Built APK"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| versionCode | \`$version_code\` |"
            echo "| versionName | \`$version_name\` |"
            echo "| commit count | \`$expected_code\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the unit tests
        # TESTS is only ever non-empty on a workflow_dispatch run (inputs.tests is empty on push
        # and pull_request), and an empty or blank filter runs the same command as before the
        # trigger existed. The input reaches the script through env, never through ${{ }} in
        # the script text, and each pattern is its own argv element: no eval, no word
        # splitting, so nothing in the input is ever run as shell.
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          if [ -z "${TESTS//[[:space:]]/}" ]; then
            ./gradlew --stacktrace testDebugUnitTest
            exit 0
          fi
          if [[ "$TESTS" == *$'\n'* ]]; then
            # read below takes one line; refuse rather than silently drop the rest.
            echo "::error::The test filter spans more than one line; separate patterns with ';'."
            exit 1
          fi
          args=()
          IFS=';' read -r -a patterns <<<"$TESTS"
          for pattern in "${patterns[@]}"; do
            # Trim surrounding whitespace; inner spaces belong to the test name.
            pattern="${pattern#"${pattern%%[![:space:]]*}"}"
            pattern="${pattern%"${pattern##*[![:space:]]}"}"
            if [ -z "$pattern" ]; then
              echo "::error::The test filter has an empty pattern (a stray ';'?): $TESTS"
              exit 1
            fi
            args+=(--tests "$pattern")
          done
          {
            echo "### Test filter"
            echo
            echo "This run was asked for a subset of the unit tests:"
            echo
            for ((i = 1; i < ${#args[@]}; i += 2)); do
              echo "- \`${args[i]}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for ((i = 1; i < ${#args[@]}; i += 2)); do
            printf 'Test filter pattern: %s\n' "${args[i]}"
          done
          ./gradlew --stacktrace testDebugUnitTest "${args[@]}"

      - name: Summarize the test results
        # Runs even when the test task failed, so the summary reports the failure rather than
        # disappearing with it. Reads the JUnit XML Gradle wrote, not the task's exit code.
        if: always()
        env:
          # Read only to relax the stale-allowlist check below on a filtered run; empty on push
          # and pull_request.
          TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          results = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          if not results:
              sys.exit(
                  "No JUnit XML in app/build/test-results/testDebugUnitTest/. The test task "
                  "produced no results at all, which is a failure, not an empty pass."
              )

          keys = ("tests", "failures", "errors", "skipped")
          totals = dict.fromkeys(keys, 0)
          rows = []
          skipped_tests = set()
          for path in results:
              suite = ET.parse(path).getroot()
              counts = {key: int(suite.get(key, 0)) for key in keys}
              for key in keys:
                  totals[key] += counts[key]
              rows.append((suite.get("name", os.path.basename(path)), counts))
              for testcase in suite.findall("testcase"):
                  if testcase.find("skipped") is not None:
                      skipped_tests.add((testcase.get("classname"), testcase.get("name")))

          lines = ["### Unit tests", "", "| suite | tests | failures | errors | skipped |",
                   "| --- | ---: | ---: | ---: | ---: |"]
          for name, counts in rows:
              lines.append(
                  "| `{}` | {} | {} | {} | {} |".format(
                      name.rsplit(".", 1)[-1], *(counts[key] for key in keys)
                  )
              )
          lines.append(
              "| **total across {} suites** | **{}** | **{}** | **{}** | **{}** |".format(
                  len(rows), *(totals[key] for key in keys)
              )
          )
          summary = "\n".join(lines)
          print(summary)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as handle:
                  handle.write(summary + "\n")

          # A test that did not run is the failure mode this whole step exists to catch: the
          # Robolectric layout tests are the ones that would go missing first, and a run that
          # silently dropped them would otherwise still be green. No expected count is
          # hardcoded -- that would break every time a test is added -- so the per-suite table
          # above is what makes a drop visible to a human.
          #
          # SKIPPED_TESTS_ALLOWLIST: an exact-match set, not a count. A skip count drifts and
          # hides which tests are actually skipped -- this checks identity instead, matching on
          # (classname, name). Any skip not in this set fails the build, same as an unallowed skip
          # always has. A listed entry that ISN'T actually skipped also fails the build: a stale
          # allowlist entry is the same invisible non-data this whole gate exists to catch, so
          # un-ignoring one of these tests must remove its entry here in the same change, not leave
          # it to rot. Three separate investigations feed most of this set, each with its own audit
          # doc; do not add another bug-investigation entry without the same kind of trail those
          # three have. One entry (GenerateFungiIndexDbAsset.generate, at the end) is a different
          # kind of thing entirely -- not a bug under investigation, see its own comment below.
          #
          # See docs/navigation/2026-08-30-return-to-vehicle-semantics-click-noop.md -- closing that
          # investigation includes removing its three entries entirely, not just shrinking them.
          SKIPPED_TESTS_ALLOWLIST = {
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "tapping the control pill's return-to-vehicle button calls onToggleReturning",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "a real touch at each trailhead control's own screen coordinates reaches that control",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "a real touch at each trailhead control's own screen coordinates reaches that "
                  "control while not returning",
              ),
              # See docs/audits/2026-08-31-search-dropdown-dismiss-chip-unmount.md -- closing that
              # investigation includes removing these twelve entries entirely, not just shrinking
              # them. (Thirteen until the navigation-chrome dispatch: "a real touch beside the
              # distance arm still reaches the map" was removed together with DistanceArm itself,
              # the composable it covered -- owner-authorised, one entry, recorded in
              # docs/navigation/2026-09-06-navigation-chrome-prebuild-report.md. Not a silenced test:
              # there is no arm left for it to touch beside.)
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "the add button opens the same plan-or-log chooser the long-press gesture used "
                  "to, then the centre-pin picker, seeded at the region center",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "tapping an observation dot shows its species name and observed date",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "a real touch on the advanced search dropdown's Set on map button reaches it and "
                  "opens the centre-pin picker over the real map",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "tapping outside the search dropdown closes it",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "tapping the bubble's close icon dismisses it without navigating anywhere",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "the locate-me icon calls onLocateMe, not onUseCurrentLocation",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "fullscreen hides the top strip and bottom nav but keeps the map mounted",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "View on iNaturalist launches the observation's web page and dismisses the bubble",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "tapping the coordinates segment reveals labeled decimal degrees, and tapping "
                  "again returns to MGRS",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "a real touch in the gap above the control pill still reaches the map",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "tapping the map while fullscreen restores chrome",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenOfflineCacheTest",
                  "tapping a recent search reports that entry and closes the dropdown",
              ),
              # See docs/audits/2026-08-31-search-bar-overlay-stub-pan-not-registering.md -- closing
              # that investigation includes removing these eight entries entirely, not just
              # shrinking them. Note: "choosing Log a find..." also has its own separate,
              # confirmed-real bug on a real device (see that doc's own "Log a find is not the same
              # case" section) -- this allowlist entry covers only its harness-side symptom here,
              # not that bug.
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenTripPlanningFlowTest",
                  "choosing Log a find calls onStartLogEntry with the picked location instead of "
                  "planning a trip",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenTripPlanningFlowTest",
                  "choosing Plan a trip, panning to a location, and confirming saves a planned trip "
                  "at that location",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenWaypointFlowTest",
                  "choosing Drop a waypoint, panning to a location, and confirming a name drops a "
                  "waypoint at that location",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "dismissing the bubble via its close icon does not let a later pan bring it back",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "after a 90 degree map rotation the observation bubble sits below the tapped dot",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "tapping elsewhere on the map dismisses the observation bubble",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "a pan while the bubble is still showing keeps it glued to its marker",
              ),
              (
                  "com.zynergylabs.forager.app.ui.availability.AvailabilityScreenMapIconStackTest",
                  "at bearing zero the observation bubble sits above the tapped dot",
              ),
              # Not a bug-investigation entry like the ones above. GenerateFungiIndexDbAsset.generate
              # is a data-file generator wrapped as a JUnit test only to reach Robolectric's Android
              # runtime (see that class's own doc comment); it rewrites a committed asset and is
              # deliberately gated behind -Pforager.generateFungiIndexDbAsset=true
              # (app/build.gradle.kts), so an ordinary testDebugUnitTest run always reports it
              # skipped, by design, permanently -- there is no fix that makes this entry go away.
              (
                  "com.zynergylabs.forager.app.tools.GenerateFungiIndexDbAsset",
                  "generate",
              ),
          }

          problems = []
          if totals["tests"] == 0:
              problems.append("no tests ran")
          unallowed_skips = skipped_tests - SKIPPED_TESTS_ALLOWLIST
          if unallowed_skips:
              problems.append(
                  "{} test(s) were skipped without an allowlist entry: {}".format(
                      len(unallowed_skips),
                      "; ".join(
                          "{}.{}".format(classname, name)
                          for classname, name in sorted(unallowed_skips)
                      ),
                  )
              )
          # A filtered "run this branch" run selects a subset, so allowlisted tests outside the
          # filter do not run, do not skip, and would all read as stale. Only that one check is
          # dropped on a filtered run; unallowed skips, zero tests, failures and errors still
          # fail it. On push and pull_request TESTS is empty and this check runs as always.
          filtered_run = bool(os.environ.get("TESTS", "").strip())
          stale_allowlist_entries = SKIPPED_TESTS_ALLOWLIST - skipped_tests
          if filtered_run:
              print("Filtered run: the stale-allowlist check is not applied.")
          elif stale_allowlist_entries:
              problems.append(
                  "{} allowlist entry(ies) no longer match an actual skip -- remove them from "
                  "SKIPPED_TESTS_ALLOWLIST: {}".format(
                      len(stale_allowlist_entries),
                      "; ".join(
                          "{}.{}".format(classname, name)
                          for classname, name in sorted(stale_allowlist_entries)
                      ),
                  )
              )
          if totals["failures"] or totals["errors"]:
              problems.append(
                  "{} failure(s) and {} error(s)".format(totals["failures"], totals["errors"])
              )
          if problems:
              sys.exit("Test results are not clean: " + "; ".join(problems) + ".")
          PY

      - name: Upload the debug APK
        # if: always() -- matches "Upload the test report" below. assembleDebug (and the
        # version check right after it) already ran and produced a real, installable APK by
        # the time the unit-test step could fail; gating this step behind that step's success
        # meant a red test run hid a build that exists and works, forcing anyone who wanted to
        # check real device behavior to build it themselves. The job still reports red on a
        # test failure -- this only stops that failure from also hiding the artifact.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error

  # Android lint on the debug variant (production release T3; dispatch 2026-10-17-03, owner's go RECORD -1195).
  # A separate job, so the build job above is unchanged. lintDebug fails on any error (lint's abortOnError default)
  # and there is no baseline; the checks switched off, and why, are in app/build.gradle.kts's lint block. Debug
  # covers the main code and the tests; the 2026-10-17 survey found release lint adds nothing (no release-only
  # sources) and skips the tests. Set up as the build job is (same pinned checkout, JDK, Gradle and SDK steps).
  lint:
    name: Android lint (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # As in the build job: resolveBuildIdentity needs the real history.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Install the Android SDK with the repo's own setup script
        run: ./scripts/setup-android-sdk.sh

      - name: Run lint on the debug variant
        # The log goes under app/build (gitignored), so it cannot mark the checkout dirty for resolveBuildIdentity.
        run: |
          set -euo pipefail
          mkdir -p app/build
          ./gradlew --stacktrace --console=plain lintDebug 2>&1 | tee app/build/lint-gradle.log

      - name: Upload the lint reports
        # if: always(), so a failing run still leaves the report that says why.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug*
            app/build/lint-gradle.log
          if-no-files-found: error

  # Release compile check (production release T8; dispatch 2026-10-17-04, owner's go RECORD -1201). CI otherwise
  # builds only the debug variant, so a release-only compile error, or src/main code that leans on a debug-only
  # dependency (debugImplementation), would first surface on the owner's machine at release time. This job
  # compiles and packages the release variant as far as it goes with no signing key: packageRelease (Kotlin and
  # Java, resources, manifest merge, dex, an unsigned APK) and packageReleaseBundle (the unsigned app bundle, the
  # form Play receives). It deliberately does not run assembleRelease or bundleRelease: those depend on
  # verifyReleaseNeverSignsWithDebugKeystore in app/build.gradle.kts, which fails by design when no signing
  # identity is configured, and no key, secret or stand-in identity is given to CI. The unsigned outputs are not
  # uploaded. A separate job, so the build job above is unchanged; set up as the build job is.
  release-compile:
    name: Release compiles and packages (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is read from git history (app/build.gradle.kts, buildIdentity), as in the build job.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Install the Android SDK with the repo's own setup script
        run: ./scripts/setup-android-sdk.sh

      - name: M2 PROOF, not for merge (dispatch 2026-10-23-03 Amendment 1)
        run: |
          set -uo pipefail
          mkdir -p app/build
          log=app/build/release-compile-gradle.log
          # 1. Wiring: the key check is in bundleRelease's and assembleRelease's task graphs, and not in packageRelease's.
          ./gradlew --console=plain --dry-run bundleRelease > app/build/dry-bundle.log 2>&1 || { tail -40 app/build/dry-bundle.log; echo "::error::dry run of bundleRelease failed"; exit 1; }
          ./gradlew --console=plain --dry-run assembleRelease > app/build/dry-assemble.log 2>&1 || { tail -40 app/build/dry-assemble.log; echo "::error::dry run of assembleRelease failed"; exit 1; }
          ./gradlew --console=plain --dry-run packageRelease packageReleaseBundle > app/build/dry-package.log 2>&1 || { tail -40 app/build/dry-package.log; echo "::error::dry run of packageRelease failed"; exit 1; }
          grep -q '^:app:verifyReleaseHasRoutingAppKey ' app/build/dry-bundle.log || { echo "::error::bundleRelease does not run the key check"; exit 1; }
          grep -q '^:app:verifyReleaseHasRoutingAppKey ' app/build/dry-assemble.log || { echo "::error::assembleRelease does not run the key check"; exit 1; }
          if grep -q '^:app:verifyReleaseHasRoutingAppKey ' app/build/dry-package.log; then echo "::error::packageRelease runs the key check"; exit 1; fi
          echo "Wiring: in bundleRelease and assembleRelease, not in packageRelease or packageReleaseBundle."
          # 2. No key: refused, with its own message.
          if ./gradlew --console=plain verifyReleaseHasRoutingAppKey > app/build/m2-nokey.log 2>&1; then echo "::error::the check passed with no key"; exit 1; fi
          grep -q 'A release build needs the routing app key' app/build/m2-nokey.log || { tail -40 app/build/m2-nokey.log; echo "::error::refused, but not by the key check"; exit 1; }
          echo "No key: refused with the key check's own message."
          # 3. A stand-in key (not the real one): passes, and the value is not printed.
          FORAGER_ROUTING_APP_KEY=stand-in-not-the-real-key ./gradlew --console=plain verifyReleaseHasRoutingAppKey > app/build/m2-key.log 2>&1 || { tail -40 app/build/m2-key.log; echo "::error::refused with a key"; exit 1; }
          grep -q 'a routing app key is set' app/build/m2-key.log || { echo "::error::no confirmation line"; exit 1; }
          if grep -q 'stand-in-not-the-real-key' app/build/m2-key.log; then echo "::error::the key value was printed"; exit 1; fi
          echo "With a key: passes, value not printed."
          cat app/build/dry-bundle.log app/build/m2-nokey.log app/build/m2-key.log > "$log"

      - name: Upload the release compile log
        # if: always(), so a failing run still leaves the log that says why.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-compile-log
          path: app/build/release-compile-gradle.log
          if-no-files-found: error

  # The route-data cutter (server/pmtiles-worker/src/rd5/) and its proof that BRouter 1.7.10 routes the same on
  # a cut as on the square it came from (dispatch 2026-10-21-07, RECORD -1546). No Gradle: Node runs the
  # TypeScript directly and the tests run BRouter's own pinned release jar in a JVM. Counts come from the JUnit
  # XML Node's test runner writes, and a file with no tests is a failure, not an empty pass.
  route-cutter:
    name: Route-data cutter routes the same as the full square
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24.22.1" }
      - name: Fetch the pinned BRouter jar and profiles
        run: server/pmtiles-worker/test/rd5/fetch-brouter.sh "$RUNNER_TEMP/brouter"
      - name: Run the cutter's tests
        env: { BROUTER_HOME: "${{ runner.temp }}/brouter" }
        run: >-
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=route-cutter-junit.xml
          "server/pmtiles-worker/test/rd5/*.test.mjs"
      - name: Summarize from the JUnit XML
        if: always()
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          if not os.path.exists("route-cutter-junit.xml"):
              sys.exit("No route-cutter-junit.xml: the tests produced no results, which is a failure.")
          cases = list(ET.parse("route-cutter-junit.xml").getroot().iter("testcase"))
          failed = sum(1 for c in cases if c.find("failure") is not None or c.find("error") is not None)
          skipped = sum(1 for c in cases if c.find("skipped") is not None)
          line = f"Route cutter: {len(cases)} tests, {failed} failed, {skipped} skipped"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f: f.write(f"### {line}\n")
          if not cases or failed or skipped:
              sys.exit("No tests ran, or a test failed or was skipped.")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: route-cutter-junit, path: route-cutter-junit.xml, if-no-files-found: error }

  # The tile Worker's route tests (server/pmtiles-worker/test/worker.test.mjs, and since dispatch 2026-10-23-01 the
  # route-data routes in test/routing.test.mjs), run against dist/index.js, the bundle
  # the owner pastes into the dashboard (dispatch 2026-10-22-01 Amendment 2, RECORD -1556: the owner, "Yes, add it").
  # No Gradle. The build is wrangler's dry run, which needs no Cloudflare login and deploys nothing. Its log is kept,
  # so a run whose bundle did not build is never read as a test result (CLAUDE.md, the revert-runner rules). Counts
  # come from the JUnit XML, and a file with no tests is a failure, as in route-cutter above.
  pmtiles-worker:
    name: Tile Worker serves what its tests say
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/pmtiles-worker
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24.22.1" }
      - name: Install the locked dependencies
        run: npm ci
      - name: Build the bundle (wrangler dry run)
        run: |
          set -o pipefail
          npm run build 2>&1 | tee worker-build.log
          test -s dist/index.js || { echo "::error::No dist/index.js: the bundle did not build."; exit 1; }
      # The bundle the owner pastes into the Cloudflare dashboard, kept so it can be downloaded from a pre-main run
      # (dispatch 2026-10-22-02; the owner, "CI keeps the built file"). Its sha256 goes in the log, so a downloaded
      # copy can be checked against the run it came from.
      - name: Record the bundle's sha256
        run: sha256sum dist/index.js
      - name: Run the Worker's tests
        run: >-
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=pmtiles-worker-junit.xml
          test/worker.test.mjs test/routing.test.mjs
      - name: Summarize from the JUnit XML
        if: always()
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          if not os.path.exists("pmtiles-worker-junit.xml"):
              sys.exit("No pmtiles-worker-junit.xml: the tests produced no results, which is a failure.")
          cases = list(ET.parse("pmtiles-worker-junit.xml").getroot().iter("testcase"))
          failed = [c.get("name") for c in cases if c.find("failure") is not None or c.find("error") is not None]
          skipped = sum(1 for c in cases if c.find("skipped") is not None)
          line = f"Tile Worker: {len(cases)} tests, {len(failed)} failed, {skipped} skipped"
          print(line)
          for name in failed: print(f"FAILED: {name}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### {line}\n")
              for name in failed: f.write(f"- failed: {name}\n")
          if not cases or failed or skipped:
              sys.exit("No tests ran, or a test failed or was skipped.")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pmtiles-worker-results
          path: |
            server/pmtiles-worker/pmtiles-worker-junit.xml
            server/pmtiles-worker/worker-build.log
          if-no-files-found: warn
      # Only when the tests above passed, so the kept file is always one the tests ran against.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pmtiles-worker-dist
          path: server/pmtiles-worker/dist/index.js
          if-no-files-found: error
