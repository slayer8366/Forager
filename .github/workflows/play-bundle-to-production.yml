name: Put an uploaded Play bundle on production (draft)

# The owner, 2026-11-09: "Go ahead and re-upload the same build to Play in the correct place". Release 2 (versionCode
# 5026, play-release.yml run #2) was uploaded to the internal track before the owner moved releases to production.
# Play refuses a second upload of a versionCode it has seen, and a new play-release.yml run would take release 3's
# number, so this uploads nothing: it creates a draft release on the production track from a bundle already in Play's
# library. Nothing reaches the public until the owner rolls the draft out in Play Console.
#
# A separate file from play-release.yml on purpose: release N is play-release.yml's run #N (owner's absolute rule,
# 2026-11-09). Same gate as the release: the `release` environment (main only, the owner approves every run).

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode of a bundle already uploaded to Play"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.zynergylabs.forager.app

jobs:
  production-draft:
    name: Draft on production from an uploaded bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release

    steps:
      - name: Refuse anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Runs only from main; this run is on $GITHUB_REF."
            exit 1
          fi

      - name: Install the Play API client (pinned)
        run: python3 -m pip install --quiet google-api-python-client==2.100.0 google-auth==2.23.0

      - name: Create the production draft
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/play-key.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$key"
          KEY_FILE="$key" python3 - <<'PY'
          import os, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          pkg = os.environ["PACKAGE_NAME"]
          code = os.environ["VERSION_CODE"].strip()
          creds = service_account.Credentials.from_service_account_file(
              os.environ["KEY_FILE"], scopes=["https://www.googleapis.com/auth/androidpublisher"])
          edits = build("androidpublisher", "v3", credentials=creds, cache_discovery=False).edits()
          edit_id = edits.insert(packageName=pkg, body={}).execute()["id"]
          bundles = edits.bundles().list(packageName=pkg, editId=edit_id).execute().get("bundles", [])
          if not any(str(b.get("versionCode")) == code for b in bundles):
              edits.delete(packageName=pkg, editId=edit_id).execute()
              print(f"::error::No uploaded bundle has versionCode {code}; nothing changed.")
              sys.exit(1)
          track = edits.tracks().get(packageName=pkg, editId=edit_id, track="production").execute()
          releases = track.get("releases", [])
          for r in releases:
              print(f"before: status={r.get('status')} versionCodes={r.get('versionCodes')} name={r.get('name')}")
          if any(r.get("status") == "draft" for r in releases):
              edits.delete(packageName=pkg, editId=edit_id).execute()
              print("::error::Production already has a draft release; nothing changed. Resolve it in Play Console first.")
              sys.exit(1)
          releases.append({"versionCodes": [code], "status": "draft"})
          edits.tracks().update(packageName=pkg, editId=edit_id, track="production",
                                body={"track": "production", "releases": releases}).execute()
          edits.commit(packageName=pkg, editId=edit_id).execute()
          check_id = edits.insert(packageName=pkg, body={}).execute()["id"]
          after = edits.tracks().get(packageName=pkg, editId=check_id, track="production").execute().get("releases", [])
          edits.delete(packageName=pkg, editId=check_id).execute()
          for r in after:
              print(f"after: status={r.get('status')} versionCodes={r.get('versionCodes')} name={r.get('name')}")
          if not any(r.get("status") == "draft" and code in r.get("versionCodes", []) for r in after):
              print(f"::error::No production draft holds versionCode {code} after the commit.")
              sys.exit(1)
          print(f"Production draft created from the uploaded bundle {code}. Roll it out in Play Console.")
          PY
