org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# KSP (Room's annotation processor) is incompatible with AGP's built-in Kotlin compiler, so this
# switches to the standalone Kotlin Android Gradle plugin (applied in app/build.gradle.kts) that
# KSP needs. Recorded here rather than left implicit, since AGP's own error message is the only
# other place this requirement is documented.
android.builtInKotlin=false
# The classic `kotlin-android` plugin (needed for KSP, see above) isn't compatible with AGP 9's
# new `ApplicationExtension`/`BaseExtension` DSL split yet — AGP's own error names this exact
# combination and recommends this flag as the bypass.
android.newDsl=false
